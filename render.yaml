services:
  - type: web
    name: aethel-core-api
    plan: free
    env: node
    rootDir: core-api
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PAYMENT_SERVICE_URL
        value: https://aethel-payment-api.onrender.com
      - key: SERVICE_SECRET
        sync: false

  - type: web
    name: aethel-payment-api
    plan: free
    env: node
    rootDir: payment-api
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5001
      - key: MONGO_URI
        sync: false
      - key: CORE_SERVICE_URL
        value: https://aethel-core-api.onrender.com
      - key: SERVICE_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
