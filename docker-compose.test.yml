# ============================================================
# Aethel — Docker Compose (CI / Integration Tests)
# ============================================================
# Usage: docker-compose -f docker-compose.test.yml up --build --abort-on-container-exit

services:
  # ── Core API ───────────────────────────────────────────────
  core-api:
    build:
      context: ./core-api
      dockerfile: Dockerfile
    container_name: aethel-core-api-test
    environment:
      - NODE_ENV=test
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=test-jwt-secret-do-not-use-in-production
      - JWT_EXPIRES_IN=1h
      - SERVICE_SECRET=test-service-secret-do-not-use-in-production
      - PAYMENT_SERVICE_URL=http://payment-api:5001
    networks:
      - aethel-test-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Payment API ────────────────────────────────────────────
  payment-api:
    build:
      context: ./payment-api
      dockerfile: Dockerfile
    container_name: aethel-payment-api-test
    environment:
      - NODE_ENV=test
      - PORT=5001
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=test-jwt-secret-do-not-use-in-production
      - SERVICE_SECRET=test-service-secret-do-not-use-in-production
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - CORE_SERVICE_URL=http://core-api:5000
    networks:
      - aethel-test-network
    depends_on:
      core-api:
        condition: service_healthy

  # ── Test Runner ────────────────────────────────────────────
  test-runner:
    build:
      context: ./core-api
      dockerfile: Dockerfile
    container_name: aethel-test-runner
    entrypoint: ["node", "src/tests/integration.test.js"]
    environment:
      - CORE_API_URL=http://core-api:5000
      - PAYMENT_API_URL=http://payment-api:5001
      - JWT_SECRET=test-jwt-secret-do-not-use-in-production
      - SERVICE_SECRET=test-service-secret-do-not-use-in-production
    networks:
      - aethel-test-network
    depends_on:
      core-api:
        condition: service_healthy
      payment-api:
        condition: service_started

networks:
  aethel-test-network:
    driver: bridge
    name: aethel-test-network
