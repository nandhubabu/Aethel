name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set lowercase repository name for Docker
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-core-api
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-payment-api
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Build Core API ---
      - name: Build and push Core API
        uses: docker/build-push-action@v5
        with:
          context: ./core-api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-core-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-core-api:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-core-api:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-core-api:buildcache,mode=max

      # --- Build Payment API ---
      - name: Build and push Payment API
        uses: docker/build-push-action@v5
        with:
          context: ./payment-api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-payment-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-payment-api:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-payment-api:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-payment-api:buildcache,mode=max

      # --- Build Frontend ---
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:buildcache,mode=max

  deploy:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
      - name: Trigger Core API Deploy
        if: env.RENDER_CORE_HOOK != ''
        env:
          RENDER_CORE_HOOK: ${{ secrets.RENDER_CORE_HOOK }}
        run: curl -X POST "$RENDER_CORE_HOOK"

      - name: Trigger Payment API Deploy
        if: env.RENDER_PAYMENT_HOOK != ''
        env:
          RENDER_PAYMENT_HOOK: ${{ secrets.RENDER_PAYMENT_HOOK }}
        run: curl -X POST "$RENDER_PAYMENT_HOOK"

      - name: Trigger Frontend Deploy
        if: env.RENDER_FRONTEND_HOOK != ''
        env:
          RENDER_FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_HOOK }}
        run: curl -X POST "$RENDER_FRONTEND_HOOK"
        
      - name: Deployment Instructions
        if: env.RENDER_CORE_HOOK == ''
        run: |
          echo "Images have been pushed to GHCR successfully."
          echo "To enable automatic deployment, add RENDER_CORE_HOOK, RENDER_PAYMENT_HOOK, and RENDER_FRONTEND_HOOK to your repository secrets."
